name: manazel_new
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # قاعدة البيانات المحلية
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.20.2

  # أيقونات iOS
  cupertino_icons: ^1.0.8

  # مشاركة النصوص والملفات
  share_plus: ^10.1.0
  
  # إنشاء ملفات PDF
  pdf: ^3.10.8
  printing: ^5.11.0
  path_provider: ^2.1.2
  excel: ^4.0.6
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # رسوم بيانية (قسم التحليل المالي داخل مركز التحليل)
  fl_chart: ^0.69.0

  # تخزين تفضيلات واجهة بسيطة غير حساسة (الإعدادات العامة)
  shared_preferences: ^2.3.3

  # مسح رمز QR (فواتير ZATCA الضريبية)
  mobile_scanner: ^7.0.0

  # القراءة الذكية للفواتير (ذكاء اصطناعي سحابي + OCR محلي احتياطي)
  http: ^1.2.0
  google_mlkit_text_recognition: ^0.15.0
  connectivity_plus: ^6.1.0
  image: ^4.3.0

  # تنبيهات انتهاء المستندات (محلية، بلا خادم)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# أيقونة أندرويد: نسخة مطابقة تماماً بايت-لبايت (MD5 متطابق) من
# assets/images/logi.jpeg موضوعة يدوياً في
# android/app/src/main/res/mipmap-nodpi/ic_launcher.jpg — بلا أي تصغير/تكبير/
# قص/هامش/تغيير ألوان/إعادة رسم من جانبنا (Pixel Perfect بطلب صريح من
# المستخدم). عمداً بلا flutter_launcher_icons (كانت ستُصغِّر/تُقصّ الشعار عند
# توليد كل حجم mipmap/Adaptive Icon) — mipmap-nodpi تعني عدم اختيار نسخة
# مختلفة حسب كثافة الجهاز؛ نفس الملف الأصلي حرفياً يُستخدَم على كل الأجهزة.
# لا تُشغِّل flutter_launcher_icons على هذا المشروع — سيُنشئ نُسخاً مُصغَّرة
# جديدة ويُبطل هذا الإعداد اليدوي.